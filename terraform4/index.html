<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Card — DevOps Bootcamp 2026</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #e2e8f0;
    }

    .card {
      width: min(360px, 90vw);
      padding: 2.5rem 2rem;
      text-align: center;
      background: #1e293b;
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      opacity: 0;
      animation: fade-in 0.9s ease forwards;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 44px rgba(0, 0, 0, 0.45);
    }

    .badge {
      width: 88px;
      height: 88px;
      margin: 0 auto 1.5rem;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      animation: pulse 2.8s ease-in-out infinite;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.01em;
      margin-bottom: 0.35rem;
    }

    .role {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
    }

    .cohort {
      display: inline-block;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #c7d2fe;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.5); }
      50%      { box-shadow: 0 0 0 14px rgba(99, 102, 241, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .badge { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <article class="card">
    <div class="badge">F</div>
    <h1>Fikri</h1>
    <p class="role">DevOps Engineer</p>
    <span class="cohort">Cohort 2026</span>
  </article>
</body>
</html>
